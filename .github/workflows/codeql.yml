name: "CodeQL Full Scan"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "0 3 * * *"   # Daily full scan at 3 AM

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Full Scan (C#)
    runs-on: windows-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: "10.0.x"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        languages: csharp
        build-mode: manual
        queries: +security-extended,security-and-quality

    - name: Build solution for CodeQL
      run: dotnet build CyberSuite.slnx --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
      with:
        category: "/language:csharp"
