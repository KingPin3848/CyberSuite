name: .NET Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: "10.0.x"

    - name: Restore dependencies
      run: dotnet restore CyberSuite.slnx

    - name: Build solution
      run: dotnet build CyberSuite.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test CyberSuite.slnx --configuration Release --no-build --verbosity normal
