name: .NET Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: "10.0.x"

    - name: Restore dependencies
      run: dotnet restore CyberSuite.sln

    - name: Build solution
      run: dotnet build CyberSuite.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test CyberSuite.sln --configuration Release --no-build --verbosity normal
