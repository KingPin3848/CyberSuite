name: .NET Build and CodeQL

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Restore dependencies
      run: dotnet restore CyberSuite.sln

    - name: Build solution
      run: dotnet build CyberSuite.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test CyberSuite.sln --configuration Release --no-build --verbosity normal
