name: .NET Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: "10.0.x"

    - name: Print .NET environment details
      run: |
        dotnet --info
        dotnet --list-sdks
        dotnet --list-runtimes

    - name: Restore dependencies
      run: dotnet restore CyberSuite.slnx --verbosity diagnostic

    - name: Build solution
      run: dotnet build CyberSuite.slnx --configuration Release --no-restore --verbosity diagnostic -bl:dotnet-build.binlog

    - name: Run tests
      run: dotnet test CyberSuite.slnx --configuration Release --no-build --verbosity diagnostic --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

    - name: Upload .NET diagnostics artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dotnet-diagnostics-${{ github.run_id }}
        path: |
          dotnet-build.binlog
          TestResults/**
        if-no-files-found: warn
        retention-days: 7
